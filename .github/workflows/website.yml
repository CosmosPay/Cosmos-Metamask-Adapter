# Keeps a fallback copy of the website on GitHub Pages. The site itself lives on our own host
# (snap.cosmospay.lat); this copy, at the repository's project page (cosmospay.github.io/Stellar-Snap/),
# is there in case that host is down. It's rebuilt whenever master changes something the site
# shows: its own sources, the adapter it compiles, or the snap's art and strings in the hero preview.
#
# The copy is built for its folder (BASE_PATH), but its canonical URLs, sitemap and hreflang point
# at the main domain, so search engines keep indexing that one. With GitHub Pages turned off
# (Settings → Pages), the site is still built, as a check, and nothing is deployed.
#
# Build settings are the repository's Actions variables, named as in packages/site/.env.example
# (Settings → Secrets and variables → Actions → Variables). They end up in the public site, so
# they're variables, not secrets. Without VITE_SITE_URL, URLs use config.ts's main domain.
name: Website fallback

on:
  push:
    branches: [master]
    paths:
      - packages/site/**
      - packages/adapter/src/**
      - packages/snap/src/**
      - packages/snap/locales/**
      - packages/snap/images/**
      - packages/snap/snap.manifest.json
      # The changelog page reads them.
      - packages/snap/CHANGELOG.md
      - packages/adapter/CHANGELOG.md
      - package-lock.json
      - .nvmrc
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails when Pages is off; the build still runs, and the deploy is skipped.
      - id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Build
        run: npm run build -w packages/site
        env:
          # The project page's folder (/Stellar-Snap); empty if Pages ever gets a domain of its own.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SNAP_ID: ${{ vars.VITE_SNAP_ID }}
          VITE_DONATION_ADDRESS: ${{ vars.VITE_DONATION_ADDRESS }}
          VITE_DONATION_URL: ${{ vars.VITE_DONATION_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ vars.VITE_BING_SITE_VERIFICATION }}
          VITE_YANDEX_VERIFICATION: ${{ vars.VITE_YANDEX_VERIFICATION }}
          VITE_BAIDU_SITE_VERIFICATION: ${{ vars.VITE_BAIDU_SITE_VERIFICATION }}
          VITE_NAVER_SITE_VERIFICATION: ${{ vars.VITE_NAVER_SITE_VERIFICATION }}
          VITE_SEZNAM_VERIFICATION: ${{ vars.VITE_SEZNAM_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist

      - name: Pages is off
        if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is off (Settings → Pages → Source → GitHub Actions turns it on), so the fallback copy wasn't deployed."

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
