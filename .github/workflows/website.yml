# Builds the website (every page prerendered in every language) and deploys it to GitHub Pages
# whenever master changes something it shows: its own sources, the adapter it compiles, or the
# snap's art and strings in the hero preview. Then announces the pages to IndexNow, if configured.
#
# Build settings are the repository's Actions variables, named as in packages/site/.env.example
# (Settings → Secrets and variables → Actions → Variables). They end up in the public site, so
# they're variables, not secrets.
name: Website

on:
  push:
    branches: [master]
    paths:
      - packages/site/**
      - packages/adapter/src/**
      - packages/snap/src/**
      - packages/snap/locales/**
      - packages/snap/images/**
      - packages/snap/snap.manifest.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      # Every link on the site is root-relative (/en/privacy/), so it needs a domain of its own:
      # a project page under github.io/<repo>/ would break them.
      - name: Check the site's address
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$BASE_PATH" ]; then
            echo "::error::GitHub Pages serves this repository under '$BASE_PATH'. Set a custom domain (Settings → Pages) so the site is at a domain's root."
            exit 1
          fi

      - name: Build
        run: npm run build -w packages/site
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || steps.pages.outputs.origin }}
          VITE_SNAP_ID: ${{ vars.VITE_SNAP_ID }}
          VITE_DONATION_ADDRESS: ${{ vars.VITE_DONATION_ADDRESS }}
          VITE_DONATION_URL: ${{ vars.VITE_DONATION_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ vars.VITE_BING_SITE_VERIFICATION }}
          VITE_YANDEX_VERIFICATION: ${{ vars.VITE_YANDEX_VERIFICATION }}
          VITE_BAIDU_SITE_VERIFICATION: ${{ vars.VITE_BAIDU_SITE_VERIFICATION }}
          VITE_NAVER_SITE_VERIFICATION: ${{ vars.VITE_NAVER_SITE_VERIFICATION }}
          VITE_SEZNAM_VERIFICATION: ${{ vars.VITE_SEZNAM_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist

      # The page list IndexNow announces once the deployment is live.
      - uses: actions/upload-artifact@v7
        with:
          name: sitemap
          path: packages/site/dist/sitemap.xml
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: deploy
    if: vars.INDEXNOW_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/site/scripts

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: sitemap
          path: packages/site/dist

      - name: Announce the pages
        run: node packages/site/scripts/indexnow.mts
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
