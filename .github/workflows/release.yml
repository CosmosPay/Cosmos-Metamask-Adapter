# Publishes the snap (@cosmosapp/stellar-snap) and the adapter (@cosmosapp/stellar-metamask-adapter)
# to npm. Releasing is merging the "Version packages" pull request (version.yml), which bumps the
# versions and writes their CHANGELOG.md entries: each package whose version isn't on npm yet is
# tested, built and published with provenance, then tagged (<name>@<version>) with a GitHub release
# whose notes are its CHANGELOG.md entry. Versions already on npm aren't published again; their
# releases' notes are still kept in step with the changelogs (the last job).
#
# npm access, either of:
#   - Trusted publishing (preferred, no secret): on npmjs.com, each package's Settings → Trusted
#     publishing → GitHub Actions, this repository and the workflow file "release.yml".
#   - An NPM_TOKEN secret: a granular npm token that can publish the @cosmosapp packages. A
#     package's first version needs it (npm only trusts a publisher for a package that exists).
name: Release

on:
  push:
    branches: [master]
    paths:
      - packages/snap/**
      - packages/adapter/**
      - scripts/release-notes.mts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [snap, adapter]
    permissions:
      # The tag and the GitHub release.
      contents: write
      # npm trusted publishing and provenance.
      id-token: write
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      # No dependency cache in a release build: what it publishes comes from the lockfile alone.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Version to publish
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm: nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Its CHANGELOG.md entry: no version goes out without its notes.
      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        run: node ../../scripts/release-notes.mts . > "$RUNNER_TEMP/notes.md"

      - if: steps.version.outputs.publish == 'true'
        run: npm ci
        working-directory: .

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      # The manifest's shasum must match the bundle that's published, or MetaMask refuses it.
      - name: Snap manifest up to date
        if: steps.version.outputs.publish == 'true' && matrix.package == 'snap'
        run: |
          if ! git diff --exit-code -- snap.manifest.json; then
            echo "::error file=packages/snap/snap.manifest.json::The snap build changed its manifest. Run 'npm run build -w packages/snap' and commit snap.manifest.json."
            exit 1
          fi

      # Trusted publishing when npm has it set up for this workflow; otherwise the NPM_TOKEN secret.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$NAME@$VERSION" --target "$GITHUB_SHA" --title "$NAME $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # The changelogs are the source and the releases mirror them: every release whose notes differ
  # from its CHANGELOG.md entry (an entry edited later, a release made before) is brought in line.
  notes:
    name: Sync release notes
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/release-notes.mts --sync
        env:
          GH_TOKEN: ${{ github.token }}
